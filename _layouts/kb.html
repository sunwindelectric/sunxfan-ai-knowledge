<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}</title>
<meta name="description" content="{{ page.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="robots" content="index,follow">
<style>
body{margin:0;font:16px/1.65 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#222;background:#fff}
main{max-width:860px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 20px}
h2{font-size:1.25rem;margin:32px 0 12px;border-bottom:1px solid #eee;padding-bottom:6px}
a{color:#0b57d0;text-decoration:none}
a:hover{text-decoration:underline}
hr{border:0;border-top:1px solid #eee;margin:32px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid #ddd;padding:6px 10px;text-align:left}
/* 产品图：默认缩略图，点击放大源站大图；右下角 SUNXFAN® 上标水印 */
img{max-width:100%;height:auto}
.kb-figure{position:relative;display:inline-block;max-width:300px;margin:12px 0;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;background:#fff;line-height:0}
.kb-figure img{display:block;width:100%;height:auto;margin:0}
.kb-wm{position:absolute;right:6px;bottom:6px;font:600 11px/1.4 -apple-system,"Segoe UI",Arial,sans-serif;color:#333;background:rgba(255,255,255,.82);padding:2px 6px;border-radius:4px;letter-spacing:.4px;line-height:1.4}
.kb-wm sup{font-size:.72em;line-height:0;vertical-align:super}
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
